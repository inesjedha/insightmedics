name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même branche annule le run précédent, devenu inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run knip # code et dépendances inutilisés
      - run: bun run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid

  backend:
    runs-on: ubuntu-latest
    # Postgres jetable : les tests tournent aussi sur le moteur de production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: im_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: mypy
      - run: pytest --cov=app --cov-report=term-missing # SQLite
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/im_test
